apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainsentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chainsentinel
  template:
    metadata:
      labels:
        app: chainsentinel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/REPLACE_GITHUB_OWNER/chainsentinel:REPLACE_WITH_IMMUTABLE_SHA
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: chainsentinel-config
            - secretRef:
                name: chainsentinel-rpc
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
