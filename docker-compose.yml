services:
  mock-primary:
    build: .
    command: ["uvicorn", "app.mock_rpc:app", "--host", "0.0.0.0", "--port", "8545"]
    environment:
      MOCK_BLOCK: "1000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8545/docs')"]
      interval: 10s
      timeout: 3s
      retries: 5
  mock-secondary:
    build: .
    command: ["uvicorn", "app.mock_rpc:app", "--host", "0.0.0.0", "--port", "8545"]
    environment:
      MOCK_BLOCK: "1002"
  gateway:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RPC_ENDPOINTS: http://mock-primary:8545,http://mock-secondary:8545
      EXPECTED_CHAIN_ID: "11155111"
      MAX_BLOCK_LAG: "5"
    depends_on:
      - mock-primary
      - mock-secondary
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 3
  prometheus:
    image: prom/prometheus:v3.4.2
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - gateway
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/chainsentinel.json:/var/lib/grafana/dashboards/chainsentinel.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
